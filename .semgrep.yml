rules:
  - id: javascript-eval
    message: Dynamic code execution is prohibited in application source.
    severity: ERROR
    languages: [javascript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: child-process-shell
    message: Shell-enabled child processes can permit command injection.
    severity: ERROR
    languages: [javascript]
    patterns:
      - pattern: '$F(..., { ..., shell: true, ... })'
      - metavariable-regex:
          metavariable: $F
          regex: ^(exec|execSync|spawn|spawnSync)$
  - id: react-dangerous-html
    message: dangerouslySetInnerHTML requires a documented sanitisation boundary.
    severity: ERROR
    languages: [javascript]
    pattern: <$X dangerouslySetInnerHTML={...} ... />
  - id: hardcoded-jwt-secret
    message: JWT secrets must come from protected runtime configuration.
    severity: ERROR
    languages: [javascript]
    patterns:
      - pattern: jwt.sign($DATA, "...")
      - pattern-not: jwt.sign($DATA, $CONFIG, ...)
  - id: weak-password-hash
    message: SHA-1 and MD5 are prohibited for password or security hashing.
    severity: ERROR
    languages: [javascript]
    pattern-either:
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash('sha1')
  - id: jwt-none-algorithm
    message: JWT verification must never permit the none algorithm.
    severity: ERROR
    languages: [javascript]
    pattern-either:
      - pattern: "jwt.verify($TOKEN, $KEY, { ..., algorithms: [..., 'none', ...], ... })"
      - pattern: "jwt.sign($DATA, $KEY, { ..., algorithm: 'none', ... })"
  - id: credentialed-wildcard-cors
    message: Credentialed CORS must not use a wildcard origin.
    severity: ERROR
    languages: [javascript]
    pattern: "cors({ ..., origin: '*', ..., credentials: true, ... })"
  - id: mongodb-where-operator
    message: Server-side JavaScript in MongoDB queries creates injection risk.
    severity: ERROR
    languages: [javascript]
    pattern: "{ ..., $where: $CODE, ... }"
  - id: disabled-tls-verification
    message: Application source must not disable TLS certificate verification.
    severity: ERROR
    languages: [javascript]
    pattern-either:
      - pattern: "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'"
      - pattern: "{ ..., rejectUnauthorized: false, ... }"
