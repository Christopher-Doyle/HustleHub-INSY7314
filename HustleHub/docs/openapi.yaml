openapi: 3.0.3
info:
  title: HustleHub+ Final POE API
  version: 3.0.0
  description: Secure freelance marketplace API. All non-health endpoints return the standard success/error envelope.
servers:
  - url: https://localhost:4000
    description: Local HTTPS API
tags:
  - name: Health
  - name: Authentication
  - name: Gigs
  - name: Bookings
  - name: Transactions
  - name: Admin
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        '200': { description: API is running, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a client or freelancer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive a 15-minute bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current bearer token
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/gigs:
    get:
      tags: [Gigs]
      summary: Browse public Gigs
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 50 } }
        - { in: query, name: category, schema: { type: string, maxLength: 80 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200': { description: Paginated Gigs, content: { application/json: { schema: { $ref: '#/components/schemas/GigListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Gigs]
      summary: Create a Gig as a freelancer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GigInput' }
      responses:
        '201': { description: Gig created, content: { application/json: { schema: { $ref: '#/components/schemas/GigResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/gigs/mine:
    get:
      tags: [Gigs]
      summary: List the authenticated freelancer's Gigs
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Owned Gigs, content: { application/json: { schema: { $ref: '#/components/schemas/GigListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/gigs/{id}:
    parameters:
      - { $ref: '#/components/parameters/ObjectId' }
    get:
      tags: [Gigs]
      summary: View a public Gig
      responses:
        '200': { description: Gig detail, content: { application/json: { schema: { $ref: '#/components/schemas/GigResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Gigs]
      summary: Update an owned Gig
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GigUpdateInput' }
      responses:
        '200': { description: Gig updated, content: { application/json: { schema: { $ref: '#/components/schemas/GigResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Gigs]
      summary: Delete an owned Gig
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Gig deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/bookings:
    post:
      tags: [Bookings]
      summary: Create a booking and linked completed transaction as a client
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gigId]
              properties:
                gigId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '201': { description: Booking and transaction created, content: { application/json: { schema: { $ref: '#/components/schemas/BookingCreateResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/bookings/me:
    get:
      tags: [Bookings]
      summary: List the authenticated client's bookings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Client bookings, content: { application/json: { schema: { $ref: '#/components/schemas/BookingListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/bookings/freelancer:
    get:
      tags: [Bookings]
      summary: List bookings for the authenticated freelancer's Gigs
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Freelancer bookings, content: { application/json: { schema: { $ref: '#/components/schemas/BookingListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/transactions/me:
    get:
      tags: [Transactions]
      summary: List the authenticated freelancer's transactions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Freelancer transactions, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/income/me:
    get:
      tags: [Transactions]
      summary: Get authenticated freelancer income totals
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Income summary, content: { application/json: { schema: { $ref: '#/components/schemas/IncomeResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/income/me/insights:
    get:
      tags: [Transactions]
      summary: Get authenticated freelancer income, monthly earnings, and estimated tax
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Financial dashboard insights, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialInsightsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/overview:
    get:
      tags: [Admin]
      summary: Get safe platform aggregate counts as an administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Administrative overview, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOverviewResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ObjectId:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
  responses:
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthenticated: { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Role or ownership denied, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Unique resource conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    UnsupportedMediaType: { description: JSON content type required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    RateLimited: { description: Request limit exceeded, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    RegisterInput:
      type: object
      additionalProperties: false
      required: [fullName, email, password, role]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
        role: { type: string, enum: [client, freelancer] }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    GigInput:
      type: object
      additionalProperties: false
      required: [title, description, category, price]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        category: { type: string, minLength: 2, maxLength: 80 }
        price: { type: number, minimum: 0, maximum: 1000000, multipleOf: 0.01 }
    GigUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        category: { type: string, minLength: 2, maxLength: 80 }
        price: { type: number, minimum: 0, maximum: 1000000, multipleOf: 0.01 }
    User:
      type: object
      required: [id, fullName, email, role]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [client, freelancer, admin] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Gig:
      type: object
      required: [id, title, description, category, price, freelancer]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        freelancer: { type: object, required: [id], properties: { id: { type: string }, fullName: { type: string } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Booking:
      type: object
      properties:
        id: { type: string }
        gigId: { type: string }
        clientId: { type: string }
        freelancerId: { type: string }
        price: { type: number }
        status: { type: string, enum: [pending, confirmed, completed, cancelled] }
        createdAt: { type: string, format: date-time }
    Transaction:
      type: object
      properties:
        id: { type: string }
        bookingId: { type: string }
        gigId: { type: string }
        clientId: { type: string }
        freelancerId: { type: string }
        amount: { type: number }
        status: { type: string, enum: [completed, failed, refunded] }
        createdAt: { type: string, format: date-time }
    HealthResponse: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { status: { type: string } } } } }
    UserResponse: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } }
    LoginResponse: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { token: { type: string }, expiresIn: { type: integer }, user: { $ref: '#/components/schemas/User' } } } } }
    GigResponse: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { gig: { $ref: '#/components/schemas/Gig' } } } } }
    GigListResponse: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { gigs: { type: array, items: { $ref: '#/components/schemas/Gig' } }, total: { type: integer }, page: { type: integer }, limit: { type: integer } } } } }
    BookingCreateResponse: { type: object, properties: { success: { type: boolean }, data: { type: object, properties: { booking: { $ref: '#/components/schemas/Booking' }, transaction: { $ref: '#/components/schemas/Transaction' } } } } }
    BookingListResponse: { type: object, properties: { success: { type: boolean }, data: { type: object, properties: { bookings: { type: array, items: { $ref: '#/components/schemas/Booking' } } } } } }
    TransactionListResponse: { type: object, properties: { success: { type: boolean }, data: { type: object, properties: { transactions: { type: array, items: { $ref: '#/components/schemas/Transaction' } } } } } }
    IncomeResponse: { type: object, properties: { success: { type: boolean }, data: { type: object, properties: { totalIncome: { type: number }, transactionCount: { type: integer } } } } }
    FinancialInsightsResponse: { type: object, properties: { success: { type: boolean }, data: { type: object, properties: { lifetimeEarnings: { type: number }, taxYearEarnings: { type: number }, yearToDateEarnings: { type: number }, estimatedAnnualTaxableIncome: { type: number }, grossIncome: { type: number }, estimatedTax: { type: number }, estimatedAfterTax: { type: number }, effectiveRate: { type: number }, transactionCount: { type: integer }, taxYear: { type: string }, reportingPeriod: { type: object, properties: { start: { type: string, format: date }, end: { type: string, format: date }, asOf: { type: string, format: date-time } } }, monthly: { type: array, items: { type: object, properties: { month: { type: string }, income: { type: number } } } }, disclaimer: { type: string }, source: { type: string, format: uri } } } } }
    AdminOverviewResponse: { type: object, properties: { success: { type: boolean }, data: { type: object, properties: { users: { type: integer }, clients: { type: integer }, freelancers: { type: integer }, admins: { type: integer }, gigs: { type: integer }, bookings: { type: integer }, transactions: { type: integer } } } } }
    ErrorResponse: { type: object, required: [success, error, requestId], properties: { success: { type: boolean, enum: [false] }, error: { type: object, properties: { code: { type: string }, message: { type: string }, details: { type: array, items: { type: string } } } }, requestId: { type: string } } }
